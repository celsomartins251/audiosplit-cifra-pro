# Oracle Cloud Always Free - ARM64
# Preparação para VM ARM64 (Ampere A1). Não publicar a API na internet antes
# de implementar autenticação e autorização por proprietário do projeto.
services:
  api:
    platform: linux/arm64
    build:
      context: ./backend
      args:
        INSTALL_WHISPERX: "false"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      # Acesso apenas local na VM até a autenticação estar implementada.
      - "127.0.0.1:8000:8000"
    environment: &audio_env
      DATABASE_URL: sqlite:////data/audiosplit.db
      UPLOAD_DIR: /data/uploads
      DATA_DIR: /data
      MODEL_DIR: /models
      TORCH_HOME: /models/torch
      HF_HOME: /models/huggingface
      XDG_CACHE_HOME: /models/cache
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CORS_ORIGINS: ""
      DEMUCS_MODEL: htdemucs_ft
      DEMUCS_SHIFTS: "1"
      WHISPER_MODEL: small
      ASR_LANGUAGE: pt
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      ENABLE_FORCED_ALIGNMENT: "false"
      ALIGNMENT_DEVICE: cpu
      ALLOW_UNCLEARED_MODEL_WEIGHTS: "false"
    volumes:
      - audiosplit_data:/data
      - model_cache:/models
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 3g
    cpus: 1.0
    restart: unless-stopped

  worker:
    platform: linux/arm64
    build:
      context: ./backend
      args:
        INSTALL_WHISPERX: "false"
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=1
    environment:
      <<: *audio_env
    volumes:
      - audiosplit_data:/data
      - model_cache:/models
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 8g
    cpus: 1.0
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    command: redis-server --appendonly yes --maxmemory 384mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

volumes:
  audiosplit_data:
  model_cache:
  redis_data:
