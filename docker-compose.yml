services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/audiosplit.db
      UPLOAD_DIR: /data/uploads
      DATA_DIR: /data
      MODEL_DIR: /models
      TORCH_HOME: /models/torch
      HF_HOME: /models/huggingface
      XDG_CACHE_HOME: /models/cache
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CORS_ORIGINS: "*"
      DEMUCS_MODEL: htdemucs_ft
      DEMUCS_SHIFTS: "2"
      WHISPER_MODEL: small
      ASR_LANGUAGE: pt
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      ENABLE_FORCED_ALIGNMENT: "true"
      ALIGNMENT_DEVICE: cpu
    volumes:
      - audiosplit_data:/data
      - model_cache:/models
    depends_on:
      redis:
        condition: service_healthy
  worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=1
    environment:
      DATABASE_URL: sqlite:////data/audiosplit.db
      UPLOAD_DIR: /data/uploads
      DATA_DIR: /data
      MODEL_DIR: /models
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DEMUCS_MODEL: htdemucs_ft
      DEMUCS_SHIFTS: "2"
      WHISPER_MODEL: small
      ASR_LANGUAGE: pt
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      ENABLE_FORCED_ALIGNMENT: "true"
      ALIGNMENT_DEVICE: cpu
      ALLOW_UNCLEARED_MODEL_WEIGHTS: "true"
    volumes:
      - audiosplit_data:/data
      - model_cache:/models
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
volumes:
  audiosplit_data:
  model_cache:
  redis_data:
